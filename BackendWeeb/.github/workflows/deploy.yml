name : Django CICD pipeline

on : 
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]


jobs:
  test:
    name: Test the Django application
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: BackendWeeb  
    steps: 
      - name: checkout repository
        uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v4
        with: 
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: BackendWeeb/requirements.txt
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Test Django migrations
        env: 
          DJANGO_SETTINGS_MODULE: BackendWeeb.settings.production
        run: |
          python manage.py check
        
      - name: Run Django tests
        env: 
          DJANGO_SETTINGS_MODULE: BackendWeeb.settings.production
        run: |
          python manage.py test

